  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            plaque: {
              blue: '#1e3a8a',
              gold: '#fbbf24',
              light: '#eff6ff',
            }
          },
          animation: {
            'bounce-short': 'bounce 1s infinite 2',

      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    ::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #999;
    }

    .ct-map {
      height: 320px !important;
      min-height: 320px;
      max-height: 320px;
      width: 100%;
      border-radius: 0.75rem;
      overflow: hidden;
      background: #e5e7eb;
    }

      width: 28px;
      height: 28px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 13px;
      font-weight: 800;
      background: #1e3a8a;
      border: 2px solid white;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.35);
    }

    .ct-stop-marker-complete {
      background: #15803d;
    }

    .ct-stop-marker-current {
      background: #f59e0b;
      color: #111827;
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.25), 0 2px 8px rgba(15, 23, 42, 0.35);
    }

    .ct-user-marker {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: #2563eb;
      border: 3px solid white;
      box-shadow: 0 0 0 5px rgba(37, 99, 235, 0.2), 0 2px 8px rgba(15, 23, 42, 0.35);

  <script>
    // --- Constants ---
    const CITIES = [

      //    defaultLat: 53.4808,

      //    exampleAddress: "St Peter's Square"
      //}
    ];
    const STORAGE_KEY = 'collections_saved_tours';
    const AUDIO_PROGRESS_KEY = 'collections_audio_progress';
    const MAX_TOUR_SIZE = 10;
    const AUDIO_UNLOCK_DISTANCE = 0.02; // ~30 metres in miles
    const ARRIVAL_DISTANCE_MILES = 0.003;
    const PRICE_BASE = 1.99;       // £ base
    const PRICE_PER_STOP = 0.50;   // £ per stop
    const RECORDED_AUDIO_BY_ID = {
      '37': 'audio/id37_henley_bridge.mp3',
      '38': 'audio/id38_the_angel.mp3',
      '39': 'audio/id39_st_marys_church.mp3',
    };

    // --- State ---
    const state = {
      view: 'HOME', // HOME, PREVIEW, TOUR, FAVORITES, COLOURS, GUIDE
      loading: false,
      error: null,

      cityIndex: 0,          // still used for the single Collections.json entry
      selectedCity: '',      // NEW: city chosen from `area`

      locationMethod: 'GPS',

      collection: '',        // selected lead_subject_primary_role
      // category is no longer used as a free-text filter
      category: '',          // (you can delete this later if you like)

      availableCities: [],       // NEW: distinct values from `area`
      availableCollections: [],  // collections for the chosen city

      candidatePlaques: [],
      activeTour: [],
      selectedForRemoval: new Set(),

      allPlaques: [],         // NEW: cache of everything from Collections.json

      currentStopIndex: 0,     // which stop is "next" on the tour
      toast: null,             // small confirmation message (e.g. after skipping)
      catalogError: null,
      visibleStoryIds: new Set(),

    };

    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;',
    }[char]));

    const jsString = (value) => escapeHtml(JSON.stringify(String(value ?? '')));

    // --- Tour Sharing Helpers ---
// --- Tour Sharing Helpers ---
// v2: only share stop IDs + light metadata, not full bios
const TourSharing = {
  encodeTourForUrl(tour) {
    const payload = {
      v: 2,
      cityName: tour.cityName || '',
      isPlanned: !!tour.isPlanned,
      startHint: tour.startHint || '',
      distanceMiles: tour.distanceMiles || 0,
      walkMinutes: tour.walkMinutes || 0,
      totalMinutes: tour.totalMinutes || 0,
      price: tour.price || 0,
      // Only pass IDs, in order
      stopIds: (tour.plaques || []).map(p => String(p.id)),
    };

    const json = JSON.stringify(payload);
    const b64 = btoa(json);            // base64-encode JSON
    return encodeURIComponent(b64);    // make it URL-safe
  },

  decodeTourFromUrlParam(param) {
    const b64 = decodeURIComponent(param);
    const json = atob(b64);
    return JSON.parse(json);
  },
};
    
    // --- Services: Geo ---
    const Geo = {
      calculateDistance: (lat1, lon1, lat2, lon2) => {
        const toRad = (value) => (value * Math.PI) / 180;
        const R = 3958.8; // Miles
        const dLat = toRad(lat2 - lat1);
        const dLon = toRad(lon2 - lon1);
        const a =
          Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.sin(dLon / 2) * Math.sin(dLon / 2) *
          Math.cos(toRad(lat1)) *
          Math.cos(toRad(lat2));
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
      },

      getCurrentPosition: () => {
        return new Promise((resolve, reject) => {
          if (!navigator.geolocation) reject('Geolocation not supported');
          else
            navigator.geolocation.getCurrentPosition(
              (pos) =>
                resolve({
                  latitude: pos.coords.latitude,
                  longitude: pos.coords.longitude,
                }),
              (err) => reject(err)
            );
        });
      },

      optimizeRoute: (startLoc, plaques) => {
        if (plaques.length <= 2) return plaques;

        const hasAllCoords = plaques.every(
          (p) => Number.isFinite(p.latitude) && Number.isFinite(p.longitude)
        );
        if (!hasAllCoords) return plaques;

        // 1. Nearest neighbour
        const pool = [...plaques];
        const route = [];
        let current = { latitude: startLoc.latitude, longitude: startLoc.longitude };

        while (pool.length > 0) {
          let nearestIdx = -1;
          let minDist = Infinity;
          for (let i = 0; i < pool.length; i++) {
            const dist = Geo.calculateDistance(
              current.latitude,
              current.longitude,
              pool[i].latitude,
              pool[i].longitude
            );
            if (dist < minDist) {
              minDist = dist;
              nearestIdx = i;
            }
          }
          const next = pool[nearestIdx];
          route.push(next);
          current = { latitude: next.latitude, longitude: next.longitude };
          pool.splice(nearestIdx, 1);
        }

        // 2. 2-opt
        const totalRouteDistance = (r) => {
          let sum = 0;
          let prev = { latitude: startLoc.latitude, longitude: startLoc.longitude };
          for (const p of r) {
            sum += Geo.calculateDistance(
              prev.latitude,
              prev.longitude,
              p.latitude,
              p.longitude
            );
            prev = p;
          }
          return sum;
        };

        const twoOptSwap = (r, i, k) => [
          ...r.slice(0, i),
          ...r.slice(i, k + 1).reverse(),
          ...r.slice(k + 1),
        ];

        let improved = true;
        let bestRoute = route;
        let bestDistance = totalRouteDistance(bestRoute);

        while (improved) {
          improved = false;
          for (let i = 0; i < bestRoute.length - 1; i++) {
            for (let k = i + 1; k < bestRoute.length; k++) {
              const newRoute = twoOptSwap(bestRoute, i, k);
              const newDistance = totalRouteDistance(newRoute);
              if (newDistance + 1e-9 < bestDistance) {
                bestRoute = newRoute;
                bestDistance = newDistance;
                improved = true;
              }
            }
          }
        }

        return bestRoute;
      },

      generateMapsPreviewUrl: (plaques) => {
        if (!plaques.length) return '';

        const baseUrl = "https://www.google.com/maps/dir/?api=1";

        const getLoc = (p) => {
          const hasCoords =
            Number.isFinite(p.latitude) && Number.isFinite(p.longitude);

          if (hasCoords) {
            return `${p.latitude},${p.longitude}`;
          }
          return encodeURIComponent((p.address || '').trim());
        };

        const dest = getLoc(plaques[plaques.length - 1]);

        let origin = '';
        let waypointPlaques = [];

        if (state.locationMethod === 'MANUAL') {
          origin = getLoc(plaques[0]);          // planned start
          waypointPlaques = plaques.slice(1, -1);
        } else {
          if (state.userLocation) {
            origin = `${state.userLocation.latitude},${state.userLocation.longitude}`;
          }
          waypointPlaques = plaques.slice(0, -1);
        }

        const waypoints = waypointPlaques.map(p => getLoc(p)).join('|');

        let url = `${baseUrl}&destination=${dest}&travelmode=walking`;
        if (origin) url += `&origin=${origin}`;
        if (waypoints) url += `&waypoints=${waypoints}`;

        return url;
      },

      generateMapsNavUrl: (plaques) => {
        if (!plaques.length) return '';

        const baseUrl = "https://www.google.com/maps/dir/?api=1";

        const getLoc = (p) => {
          const hasCoords =
            Number.isFinite(p.latitude) && Number.isFinite(p.longitude);

          if (hasCoords) {
            return `${p.latitude},${p.longitude}`;
          }
          return encodeURIComponent((p.address || '').trim());
        };

        const dest = getLoc(plaques[plaques.length - 1]);
        const waypointPlaques = plaques.slice(0, -1);
        const waypoints = waypointPlaques.map(p => getLoc(p)).join('|');

        let url = `${baseUrl}&destination=${dest}&travelmode=walking`;
        if (waypoints) url += `&waypoints=${waypoints}`;

        return url;
      },

      generateMapsStopUrl: (plaque) => {
        if (!plaque) return '';

        const hasCoords =
          Number.isFinite(plaque.latitude) && Number.isFinite(plaque.longitude);
        const destination = hasCoords
          ? `${plaque.latitude},${plaque.longitude}`
          : encodeURIComponent((plaque.address || '').trim());

        if (!destination) return '';

        let url = `https://www.google.com/maps/dir/?api=1&destination=${destination}&travelmode=walking`;
        if (
          state.userLocation &&
          Number.isFinite(state.userLocation.latitude) &&
          Number.isFinite(state.userLocation.longitude)
        ) {
          url += `&origin=${state.userLocation.latitude},${state.userLocation.longitude}`;
        }

        return url;
      },

      generateMapsPointUrl: (loc) => {
        if (
          !loc ||
          !Number.isFinite(loc.latitude) ||
          !Number.isFinite(loc.longitude)
        ) {
          return '';
        }

        return `https://www.google.com/maps/search/?api=1&query=${loc.latitude},${loc.longitude}`;
      },

      // find densest cluster of plaques within a radius
      findBestCluster: (plaques, radiusMiles) => {
        const points = plaques.filter(p =>
          Number.isFinite(p.latitude) && Number.isFinite(p.longitude)
        );

        if (!points.length) {
          return { center: null, members: [] };
        }

        let bestIndex = 0;
        let bestCount = 1;

        for (let i = 0; i < points.length; i++) {
          const pivot = points[i];
          let count = 0;

          for (let j = 0; j < points.length; j++) {
            const other = points[j];
            const dist = Geo.calculateDistance(
              pivot.latitude,
              pivot.longitude,
              other.latitude,
              other.longitude
            );
            if (dist <= radiusMiles) count++;
          }

          if (count > bestCount) {
            bestCount = count;
            bestIndex = i;
          }
        }

        const centerPlaque = points[bestIndex];
        const center = {
          latitude: centerPlaque.latitude,
          longitude: centerPlaque.longitude
        };

        const members = points.filter(p =>
          Geo.calculateDistance(
            center.latitude,
            center.longitude,
            p.latitude,
            p.longitude
          ) <= radiusMiles
        );

        return { center, members };
      },

      computeTourStats: (startLoc, plaques) => {
        let distance = 0;
        let prev = { latitude: startLoc.latitude, longitude: startLoc.longitude };

        for (const p of plaques) {
          if (Number.isFinite(p.latitude) && Number.isFinite(p.longitude)) {
            distance += Geo.calculateDistance(
              prev.latitude,
              prev.longitude,
              p.latitude,
              p.longitude
            );
            prev = { latitude: p.latitude, longitude: p.longitude };
          }
        }

        const walkingMinutes = distance * 20; // ~3 mph
        return { distanceMiles: distance, walkingMinutes };
      }
    };

    // --- Speech synthesis voice selection ---
    let preferredVoice = null;

    function choosePreferredVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      if (!voices || !voices.length) return null;

      // 1. Try an explicitly "UK English Female" style voice name
      const explicitUkFemale = voices.find(v =>
        /UK English Female/i.test(v.name)
      );

      // 2. Any en-GB voice whose name looks like it might be female
      const enGbFemale = voices.find(v =>
        v.lang === 'en-GB' && /female|woman|girl/i.test(v.name)
      );

      // 3. Any en-GB voice
      const enGb = voices.find(v => v.lang === 'en-GB');

      // 4. Any English voice
      const anyEnglish = voices.find(v => v.lang && v.lang.startsWith('en'));

      return explicitUkFemale || enGbFemale || enGb || anyEnglish || voices[0];
    }

    function initVoiceSupport() {
      if (!('speechSynthesis' in window)) return;

      const assign = () => {
        preferredVoice = choosePreferredVoice();
        // console.log('Chosen voice:', preferredVoice);
      };

      // Try immediately
      assign();

      // Some browsers load voices async
      window.speechSynthesis.onvoiceschanged = assign;
    }

    // --- Services: API ---
    const Api = {
      fetchPlaques: async (url) => {
        const res = await fetch(url);
        if (!res.ok) {
          throw new Error(`Could not load tour catalogue (${res.status})`);
        }
        const data = await res.json();

        return data.map((item, idx) => ({
          id: String(item.id ?? `plaque-${idx}`),
          title: item.title || 'Unknown Title',

          // Collection / role
          category: item.lead_subject_primary_role || item.category || '',

          // City / area
          area: item.area || '',

          latitude: parseFloat(item.latitude),
          longitude: parseFloat(item.longitude),
          address: item.address || '',

          // summary text shown on screen
          summary:
            item.inscription ||
            item.subjects ||
            item.summary ||
            item.description ||
            'No description available.',

          // long-form bio text – audio only
          bio: item.lead_subject_bio || '',
          audioFile:
            item.audio_file ||
            item.audioFile ||
            RECORDED_AUDIO_BY_ID[String(item.id)] ||
            ''
        }));
      },

      geocode: async (query) => {
        const res = await fetch(
          `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(
            query
          )}&limit=1`
        );
        const data = await res.json();
        if (data && data.length) {
          return {
            latitude: parseFloat(data[0].lat),
            longitude: parseFloat(data[0].lon),
          };
        }
        throw new Error('Location not found');
      },

      // reverse geocoding for startHint / display text
      reverseGeocode: async (loc) => {
        const { latitude, longitude } = loc;

        const res = await fetch(
          `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=16&addressdetails=1`
        );
        const data = await res.json();

        if (data && data.display_name) {
          return data.display_name;
        }

        if (data && data.address) {
          const { road, suburb, city, town, village, state, postcode } = data.address;
          const line = [road, suburb || city || town || village, state, postcode]
            .filter(Boolean)
            .join(', ');
          if (line) return line;
        }

        // Fallback to raw coords if nothing nicer
        return `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
      }
    };
    // --- Icons (SVG Strings) ---
    const Icons = {

      markTourPaidAndSave: () => {
  if (!state.activeTour.length) return;

  // Freeze stop numbers for this tour
  state.activeTour = state.activeTour.map((p, idx) => ({
    ...p,
    stopNumber: p.stopNumber || idx + 1,   // 1-based, stable
  }));

        const cityName =
          state.selectedCity || (CITIES[state.cityIndex]?.name || 'Tour');

        const existing = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

        let id = state.activeTourMeta && state.activeTourMeta.id;

        // Prepare a default tour name if we need to create a new entry
        const defaultName = state.isPlanned
          ? `${cityName} – ${state.startHint || 'planned walk'}`
          : `${cityName} walk`;

        // If this tour already exists in favourites, update that record
        if (id) {
          const idx = existing.findIndex((t) => t.id === id);
          if (idx !== -1) {
            existing[idx] = {
              ...existing[idx],
              cityName,
              plaques: state.activeTour,
              isPlanned: state.isPlanned,
              startHint: state.startHint,
              distanceMiles: state.tourDistanceMiles,
              walkMinutes: state.tourWalkMinutes,
              totalMinutes: state.tourTotalMinutes,
              price: state.tourPrice,
              isPaid: true,
            };
          } else {
            // If somehow the id isn’t in storage, fall back to creating a new entry
            id = null;
          }
        }

        // If there is no existing entry, create one automatically
        if (!id) {
          id = Date.now().toString();
          const tour = {
            id,
            name: defaultName,
            date: new Date().toISOString(),
            cityName,
            plaques: state.activeTour,
            isPlanned: state.isPlanned,
            startHint: state.startHint,
            distanceMiles: state.tourDistanceMiles,
            walkMinutes: state.tourWalkMinutes,
            totalMinutes: state.tourTotalMinutes,
            price: state.tourPrice,
            isPaid: true,
          };
          existing.unshift(tour);
        }

        state.activeTourMeta = { id, isPaid: true };

        localStorage.setItem(STORAGE_KEY, JSON.stringify(existing));
      },

      // Update State Actions
      setMethod: (method) => { state.locationMethod = method; app.render(); },
      setAddress: (val) => { state.manualAddress = val; },

        const plaques = state.allPlaques || [];
        const collectionsSet = new Set(
          plaques
            .filter(p => !cityName || p.area === cityName)
            .map(p => p.category)
            .filter(c => c && c.trim())
        );
        state.availableCollections = Array.from(collectionsSet).sort();

        // If the previously selected collection doesn’t exist for this city,

        if (!state.availableCollections.includes(state.collection)) {

                  getCurrentStopIndex: () => {

            getRemainingStops: () => {
                if (!state.activeTour || !state.activeTour.length) return [];
                const idx = state.currentStopIndex || 0;
                const start = Math.min(idx, state.activeTour.length);
                return state.activeTour.slice(start);

            showToast: (message) => {

                app.render();
                setTimeout(() => {

            formatAudioTime: (seconds) => {
                const safeSeconds = Math.max(0, Math.floor(Number(seconds) || 0));
                const mins = Math.floor(safeSeconds / 60);
                const secs = String(safeSeconds % 60).padStart(2, '0');
                return `${mins}:${secs}`;
            },

            getAudioProgress: (plaqueId) => {
                const progress = state.audioProgressByStop?.[plaqueId];
                if (!progress || !Number.isFinite(progress.time)) {
                    return { time: 0, duration: 0 };
                }
                return {
                    time: Math.max(0, progress.time || 0),
                    duration: Math.max(0, progress.duration || 0),
                };
            },

            saveAudioProgress: (plaqueId, time, duration) => {
                if (!plaqueId) return;
                const safeTime = Math.max(0, Number(time) || 0);
                const safeDuration = Math.max(0, Number(duration) || 0);

                if (!state.audioProgressByStop) state.audioProgressByStop = {};

                if (safeDuration > 0 && safeTime >= safeDuration - 2) {
                    delete state.audioProgressByStop[plaqueId];
                } else if (safeTime > 2) {
                    state.audioProgressByStop[plaqueId] = {
                        time: safeTime,
                        duration: safeDuration,
                        updatedAt: Date.now(),
                    };
                }

                localStorage.setItem(
                    AUDIO_PROGRESS_KEY,
                    JSON.stringify(state.audioProgressByStop)
                );
            },

            clearAudioProgress: (plaqueId) => {
                if (!plaqueId || !state.audioProgressByStop) return;
                delete state.audioProgressByStop[plaqueId];
                localStorage.setItem(
                    AUDIO_PROGRESS_KEY,
                    JSON.stringify(state.audioProgressByStop)
                );
            },

            updateAudioProgressUi: () => {
                const plaqueId = state.currentSpeechPlaqueId;
                if (!plaqueId || !state.currentAudioElement) return;

                const audio = state.currentAudioElement;
                const duration = Number.isFinite(audio.duration) ? audio.duration : 0;
                const time = Number.isFinite(audio.currentTime) ? audio.currentTime : 0;
                state.currentAudioTime = time;
                state.currentAudioDuration = duration;
                app.saveAudioProgress(plaqueId, time, duration);

                const range = document.getElementById(`audio-range-${plaqueId}`);
                if (range) range.value = String(Math.floor(time));

                const label = document.getElementById(`audio-time-${plaqueId}`);
                if (label) {
                    const durationLabel = duration ? app.formatAudioTime(duration) : '--:--';
                    label.textContent = `${app.formatAudioTime(time)} / ${durationLabel}`;
                }
            },

            seekAudio: (seconds) => {
                const audio = state.currentAudioElement;
                if (!audio) return;
                const target = Math.max(0, Number(seconds) || 0);
                audio.currentTime = target;
                app.updateAudioProgressUi();
            },

            destroyMap: (key) => {
                const map = state.mapInstances?.[key];
                if (!map) return;
                try {
                    map.remove();
                } catch (err) {
                    console.warn('Map cleanup failed', err);
                }
                delete state.mapInstances[key];
            },

            destroyAllMaps: () => {

            },

            renderRouteDiagram: (containerId, options = {}) => {
                const container = document.getElementById(containerId);
                if (!container) return;

                app.destroyMap(containerId);

                const routeStops = (state.activeTour || [])
                    .map((p, idx) => ({ ...p, routeIndex: idx }))
                    .filter(p => Number.isFinite(p.latitude) && Number.isFinite(p.longitude));

                if (!routeStops.length) {
                    container.innerHTML = `
                      <div class="h-full flex items-center justify-center p-4 text-center text-sm text-gray-600">
                        This tour does not have enough coordinates to draw the route.
                      </div>
                    `;
                    return;
                }

                const width = 360;
                const height = 240;
                const pad = 34;
                const lats = routeStops.map(p => p.latitude);
                const lngs = routeStops.map(p => p.longitude);

                if (
                    state.userLocation &&
                    Number.isFinite(state.userLocation.latitude) &&
                    Number.isFinite(state.userLocation.longitude)
                ) {
                    lats.push(state.userLocation.latitude);
                    lngs.push(state.userLocation.longitude);
                }

                const minLat = Math.min(...lats);
                const maxLat = Math.max(...lats);
                const minLng = Math.min(...lngs);
                const maxLng = Math.max(...lngs);
                const latSpan = Math.max(maxLat - minLat, 0.0001);
                const lngSpan = Math.max(maxLng - minLng, 0.0001);

                const pointFor = (lat, lng) => ({
                    x: pad + ((lng - minLng) / lngSpan) * (width - pad * 2),
                    y: pad + ((maxLat - lat) / latSpan) * (height - pad * 2),
                });

                const points = routeStops.map(p => ({
                    ...p,
                    ...pointFor(p.latitude, p.longitude),
                }));
                const currentIndex = Math.min(
                    Math.max(state.currentStopIndex || 0, 0),
                    Math.max((state.activeTour || []).length - 1, 0)
                );
                const routeLine = points.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

                let userSvg = '';
                let userLineSvg = '';
                if (
                    state.userLocation &&
                    Number.isFinite(state.userLocation.latitude) &&
                    Number.isFinite(state.userLocation.longitude)
                ) {
                    const userPoint = pointFor(state.userLocation.latitude, state.userLocation.longitude);
                    const currentPoint = points.find(p => p.routeIndex === currentIndex);
                    if (options.mode === 'tour' && currentPoint) {
                        userLineSvg = `
                          <line x1="${userPoint.x.toFixed(1)}" y1="${userPoint.y.toFixed(1)}"
                                x2="${currentPoint.x.toFixed(1)}" y2="${currentPoint.y.toFixed(1)}"
                                stroke="#16a34a" stroke-width="3" stroke-linecap="round"
                                stroke-dasharray="6 6" />
                        `;
                    }
                    userSvg = `
                      <circle cx="${userPoint.x.toFixed(1)}" cy="${userPoint.y.toFixed(1)}" r="8"
                              fill="#2563eb" stroke="white" stroke-width="3" />
                      <circle cx="${userPoint.x.toFixed(1)}" cy="${userPoint.y.toFixed(1)}" r="15"
                              fill="none" stroke="#2563eb" stroke-opacity="0.2" stroke-width="6" />
                    `;
                }

                const markerSvg = points.map((p) => {
                    const isComplete = p.routeIndex < currentIndex;
                    const isCurrent = p.routeIndex === currentIndex;
                    const fill = isCurrent ? '#f59e0b' : isComplete ? '#15803d' : '#1e3a8a';
                    const textFill = isCurrent ? '#111827' : '#ffffff';
                    const label = escapeHtml(p.title || `Stop ${p.routeIndex + 1}`);

                    return `
                      <g>
                        <title>${label}</title>
                        ${isCurrent
                          ? `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="20"
                                     fill="#f59e0b" opacity="0.22" />`
                          : ''}
                        <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="14"
                                fill="${fill}" stroke="white" stroke-width="3" />
                        <text x="${p.x.toFixed(1)}" y="${(p.y + 4).toFixed(1)}"
                              text-anchor="middle" font-size="12" font-weight="800"
                              fill="${textFill}">${p.routeIndex + 1}</text>
                      </g>
                    `;
                }).join('');

                container.innerHTML = `
                  <svg viewBox="0 0 ${width} ${height}" class="w-full h-full block" role="img"
                       aria-label="Ordered route diagram">
                    <rect x="0" y="0" width="${width}" height="${height}" rx="16" fill="#eef2f7" />
                    <path d="M 18 54 C 82 18, 119 88, 188 52 S 296 34, 342 86"
                          fill="none" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round" opacity="0.55" />
                    <path d="M 22 188 C 86 146, 130 198, 188 156 S 286 128, 338 174"
                          fill="none" stroke="#dbeafe" stroke-width="18" stroke-linecap="round" opacity="0.8" />
                    ${routeLine
                      ? `<polyline points="${routeLine}" fill="none" stroke="#1e3a8a"
                                   stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />`
                      : ''}
                    ${userLineSvg}
                    ${markerSvg}
                    ${userSvg}
                  </svg>
                `;
            },

            renderRouteMap: (containerId, options = {}) => {
                app.renderRouteDiagram(containerId, options);
            },

      resetPlanningSelection: () => {
        state.planningMarkedForReplace = new Set();

      applyPlanningChanges: () => {
        const idsToReplace = Array.from(state.planningMarkedForReplace).map(String);
        if (!idsToReplace.length) {
          alert('You haven’t selected any stops to replace on this tour.');
          return;
        }

        if (!state.activeTour.length || !state.candidatePlaques.length) {
          alert('There is no active tour to modify yet.');
          return;
        }

        const removedSet = new Set(idsToReplace);

        // 1) Keep all non-selected stops
        const kept = state.activeTour.filter(
          p => !removedSet.has(String(p.id))
        );

        // 2) Build a pool of possible replacements:
        //    - must be in candidatePlaques
        //    - must NOT already be kept
        //    - must NOT be one of the removed ones
        const keptIds = new Set(kept.map(p => String(p.id)));
        const pool = state.candidatePlaques.filter(p => {
          const id = String(p.id);
          return !keptIds.has(id) && !removedSet.has(id);
        });

        const desired = state.stops;             // what user asked for via slider
        let needed = desired - kept.length;      // how many new ones we ideally want

        if (needed <= 0) {
          // They’re removing more than or equal to the “desired” count,
          // so we will inevitably shorten the tour.
          const shortenOk = confirm(
            `Removing these stops will shorten your tour from ${desired} to ${kept.length} stops.\n\n` +
            `Press OK to continue with a shorter tour, or Cancel to go back and adjust your selection.`
          );
          if (!shortenOk) return;

          // No replacements – just keep the remaining ones
          let newTour = kept;
          if (state.userLocation && newTour.length > 1) {
            newTour = Geo.optimizeRoute(state.userLocation, newTour);
          }
          state.activeTour = newTour;
          state.stops = newTour.length;
          state.planningMarkedForReplace = new Set();
          app.render();
          return;
        }

        // Case: enough replacements available
        if (pool.length >= needed) {
          const replacements = pool
            .slice()                     // copy
            .sort(() => 0.5 - Math.random())
            .slice(0, needed);

          let newTour = [...kept, ...replacements];
          if (state.userLocation && newTour.length > 1) {
            newTour = Geo.optimizeRoute(state.userLocation, newTour);
          }

          state.activeTour = newTour;
          // tour size stays at the user’s requested value
          state.planningMarkedForReplace = new Set();
          app.render();
          return;
        }

        // Case: NOT enough replacements – this is the scenario you described:
        // "I can replace 2 of the 3 stops…"
        const canReplace = pool.length;

        if (canReplace === 0) {
          alert(
            'There are no additional nearby places available to replace the selected stops.\n\n' +
            'Try reducing the number you want to replace or increasing your radius.'
          );
          return;
        }

        const newSize = kept.length + canReplace;
        const ok = confirm(
          `You asked to replace ${idsToReplace.length} stops, ` +
          `but I can only find ${canReplace} alternative locations nearby.\n\n` +
          `Press OK to shorten your tour to ${newSize} stops, ` +
          `or Cancel to go back and adjust which stops you want to replace.`
        );

        if (!ok) return;

        const replacements = pool
          .slice()
          .sort(() => 0.5 - Math.random())
          .slice(0, canReplace);

        let newTour = [...kept, ...replacements];
        if (state.userLocation && newTour.length > 1) {
          newTour = Geo.optimizeRoute(state.userLocation, newTour);
        }

        state.activeTour = newTour;
        state.stops = newTour.length;       // update slider to the new reality
        state.planningMarkedForReplace = new Set();
        app.render();
      },

speak: async (plaqueId) => {
  const plaque = state.activeTour.find(p => p.id === plaqueId);
  if (!plaque) return;

  const hasRecordedAudio = !!plaque.audioFile;
  const shouldRestartCurrentAudio =
    state.currentSpeechPlaqueId === plaqueId &&
    (state.isSpeechPlaying || state.isSpeechPaused);

  if (!hasRecordedAudio && !('speechSynthesis' in window)) {
    alert('Spoken audio is not supported on this device/browser.');
    return;
  }

  // Ensure the unlocked set exists
  if (!state.unlockedStops) {
    state.unlockedStops = new Set();
  }

  // --- Location gate: stop couch-surfing ---
  // Only enforce GPS / distance if this stop has NOT yet been unlocked.
  if (!state.unlockedStops.has(plaqueId)) {
    let loc;
    try {
      // Fresh position each time
      loc = await Geo.getCurrentPosition();
      state.userLocation = loc;
    } catch (err) {
      alert(
        "To hear this stop, you'll need to allow location access on your device " +
        "and listen while you’re actually at the stop."
      );
      return;
    }

    const hasCoords =
      Number.isFinite(plaque.latitude) && Number.isFinite(plaque.longitude);

    if (hasCoords) {
      const dist = Geo.calculateDistance(
        loc.latitude,
        loc.longitude,
        plaque.latitude,
        plaque.longitude
      );

      if (dist > AUDIO_UNLOCK_DISTANCE) {
        alert(
          "Sorry, this audio can only be played when you are physically at this stop.\n\n" +
          "Walk to the stop, then try again."
        );
        return;
      }
    }

    // You’re close enough – mark as unlocked from now on
    state.unlockedStops.add(plaqueId);
  }

  app.stopSpeech();
  if (shouldRestartCurrentAudio) {
    app.clearAudioProgress(plaqueId);
  }

  if (hasRecordedAudio) {
    const audio = new Audio(plaque.audioFile);
    const savedProgress = app.getAudioProgress(plaqueId);
    state.currentAudioElement = audio;
    state.currentSpeechPlaqueId = plaqueId;
    state.isSpeechPlaying = true;
    state.isSpeechPaused = false;
    state.currentAudioTime = savedProgress.time || 0;
    state.currentAudioDuration = savedProgress.duration || 0;
    state.lastAudioRenderAt = 0;
    app.render();

    audio.onloadedmetadata = () => {
      const saved = app.getAudioProgress(plaqueId);
      const duration = Number.isFinite(audio.duration) ? audio.duration : 0;
      const canResume = saved.time > 2 && (!duration || saved.time < duration - 2);
      if (canResume) {
        audio.currentTime = saved.time;
      }
      state.currentAudioDuration = duration;
      app.updateAudioProgressUi();
    };

    audio.ontimeupdate = () => {
      app.updateAudioProgressUi();
    };

    audio.onended = () => {
      if (state.currentAudioElement === audio) {
        state.currentAudioElement = null;
        state.isSpeechPlaying = false;
        state.isSpeechPaused = false;
        state.currentSpeechPlaqueId = null;
        state.currentAudioTime = 0;
        state.currentAudioDuration = 0;
        app.clearAudioProgress(plaqueId);
        app.render();
      }
    };

    audio.onerror = () => {
      if (state.currentAudioElement === audio) {
        state.currentAudioElement = null;
        state.currentAudioTime = 0;
        state.currentAudioDuration = 0;
      }
      app.playTextToSpeech(plaque, plaqueId);
    };

    try {
      await audio.play();
    } catch (err) {
      console.error('Recorded audio failed', err);
      state.currentAudioElement = null;
      state.currentAudioTime = 0;
      state.currentAudioDuration = 0;
      app.playTextToSpeech(plaque, plaqueId);
    }
    return;
  }

  app.playTextToSpeech(plaque, plaqueId);
},

playTextToSpeech: (plaque, plaqueId) => {
  if (!('speechSynthesis' in window)) {
    alert('Recorded audio could not be played, and spoken audio is not supported on this device/browser.');
    state.isSpeechPlaying = false;
    state.isSpeechPaused = false;
    state.currentSpeechPlaqueId = null;
    app.render();
    return;
  }

  window.speechSynthesis.cancel();

  const baseText = `${plaque.title}. ${plaque.bio || plaque.summary || ''}`;
  const text = baseText.trim();
  if (!text) {
    alert('No description available to read for this place of interest.');
    return;
  }

  const utterance = new SpeechSynthesisUtterance(text);

  if (preferredVoice) {
    utterance.voice = preferredVoice;
    utterance.lang = preferredVoice.lang || 'en-GB';
  } else {
    utterance.lang = 'en-GB';
  }

  utterance.rate = 0.95;
  utterance.pitch = 1.0;
  utterance.volume = 1.0;

  utterance.onstart = () => {
    state.currentSpeechPlaqueId = plaqueId;
    state.isSpeechPlaying = true;
    state.isSpeechPaused = false;
    app.render();
  };

  utterance.onend = () => {
    state.isSpeechPlaying = false;
    state.isSpeechPaused = false;
    state.currentSpeechPlaqueId = null;
    app.render();
  };

  utterance.onerror = (e) => {
    console.error('Speech error', e);
    state.isSpeechPlaying = false;
    state.isSpeechPaused = false;
    state.currentSpeechPlaqueId = null;
    app.render();
  };

  window.speechSynthesis.speak(utterance);
},



      pauseSpeech: () => {
        if (state.currentAudioElement) {
          app.updateAudioProgressUi();
          state.currentAudioElement.pause();
        } else if ('speechSynthesis' in window) {
          window.speechSynthesis.pause();
        } else {
          return;
        }
        state.isSpeechPlaying = false;
        state.isSpeechPaused = true;
        app.render();
      },

      resumeSpeech: () => {
        if (state.currentAudioElement) {
          state.currentAudioElement.play().catch((err) => {
            console.error('Recorded audio resume failed', err);
            state.isSpeechPlaying = false;
            state.isSpeechPaused = true;
            app.render();
          });
        } else if ('speechSynthesis' in window) {
          window.speechSynthesis.resume();
        } else {
          return;
        }
        state.isSpeechPlaying = true;
        state.isSpeechPaused = false;
        app.render();
      },

      restartAudio: (plaqueId) => {
        app.stopSpeech();
        app.clearAudioProgress(plaqueId);
        app.speak(plaqueId);
      },

      stopSpeech: () => {
        if (state.currentAudioElement) {
          app.updateAudioProgressUi();
          state.currentAudioElement.pause();
          state.currentAudioElement.currentTime = 0;
          state.currentAudioElement = null;
        }
        if (!('speechSynthesis' in window)) {
          state.isSpeechPlaying = false;
          state.isSpeechPaused = false;
          state.currentSpeechPlaqueId = null;
          state.currentAudioTime = 0;
          state.currentAudioDuration = 0;
          app.render();
          return;
        }
        window.speechSynthesis.cancel();
        state.isSpeechPlaying = false;
        state.isSpeechPaused = false;
        state.currentSpeechPlaqueId = null;
        state.currentAudioTime = 0;
        state.currentAudioDuration = 0;
        app.render();
      },

      manualUnlockStop: (plaqueId) => {
        if (!state.unlockedStops) state.unlockedStops = new Set();
        if (!state.bannerDismissedStops) state.bannerDismissedStops = new Set();

        state.unlockedStops.add(plaqueId);
        state.bannerDismissedStops.add(plaqueId);
        if (state.nearlyThereStopId === plaqueId) {

        app.showToast('Audio unlocked for this stop.');

      toggleStoryText: (plaqueId) => {

          state.visibleStoryIds.delete(plaqueId);
        } else {
          state.visibleStoryIds.add(plaqueId);
        }
        app.render();
      },

      toggleAutoPlay: () => {
        state.isAutoPlay = !state.isAutoPlay;

        else app.stopAudioWatch();
        app.render();
      },

      startAudioWatch: () => {
  if (!navigator.geolocation) return;

  // Clear any previous watcher
  app.stopAudioWatch();

  if (!state.unlockedStops) state.unlockedStops = new Set();
  state.nearPromptedStopId = null;
  state.arrivalPromptedStopId = null;
  if (!state.bannerDismissedStops) state.bannerDismissedStops = new Set();

  state.watchId = navigator.geolocation.watchPosition(
    (pos) => {
      const uLat = pos.coords.latitude;
      const uLng = pos.coords.longitude;
      state.userLocation = { latitude: uLat, longitude: uLng };
      if (state.view === 'TOUR') {
        const now = Date.now();
        if (now - state.lastMapLocationRenderAt > 5000) {
          state.lastMapLocationRenderAt = now;
          app.renderRouteMap('tour-map', { mode: 'tour' });
        }
      }

      // No active tour? Nothing to do.
      if (!state.activeTour.length) return;

      // ALWAYS use the current UI stop index – not unlockedStops
      const idx = state.currentStopIndex || 0;
      const nextStop = state.activeTour[idx];
      if (!nextStop) {
        // We’ve gone past the last stop – stop watching.
        app.stopAudioWatch();
        return;
      }

      if (
        !Number.isFinite(nextStop.latitude) ||
        !Number.isFinite(nextStop.longitude)
      ) {
        return;
      }

      const dist = Geo.calculateDistance(
        uLat,
        uLng,
        nextStop.latitude,
        nextStop.longitude
      );

            // 1) "You’re here" cue – very close (~5m)
      if (
        dist <= ARRIVAL_DISTANCE_MILES &&
        !state.bannerDismissedStops.has(nextStop.id)
      ) {
        // Mark this stop as unlocked for audio
        if (!state.unlockedStops.has(nextStop.id)) {
          state.unlockedStops.add(nextStop.id);
        }
        state.nearlyThereStopId = nextStop.id;

        if (state.arrivalPromptedStopId !== nextStop.id) {
          state.arrivalPromptedStopId = nextStop.id;

          // HAPTIC + audio
          if (navigator.vibrate) {
            navigator.vibrate(250);
          }
          app.playArrivalPrompt(nextStop);
        }

        app.render();
        return; // don't also fire the "approaching" cue on this tick
      }

            // 2) "You’re approaching" cue – within main unlock radius
      if (
        dist <= AUDIO_UNLOCK_DISTANCE &&
        !state.bannerDismissedStops.has(nextStop.id)
      ) {
        if (!state.unlockedStops.has(nextStop.id)) {
          state.unlockedStops.add(nextStop.id);
        }
        state.nearlyThereStopId = nextStop.id;

        if (state.nearPromptedStopId !== nextStop.id) {
          state.nearPromptedStopId = nextStop.id;

          // HAPTIC + audio
          if (navigator.vibrate) {
            navigator.vibrate(150);
          }
          app.playNearStopPrompt(nextStop);
        }

        app.render();
      }
    },
    (err) => console.error(err),
    { enableHighAccuracy: true }
  );
},
      stopAudioWatch: () => {
        if (state.watchId !== null) {
          navigator.geolocation.clearWatch(state.watchId);
          state.watchId = null;
        }
      },

  advanceToNextFromStop: (plaqueId, toastMessage, reopenMaps) => {
  if (!state.activeTour || !state.activeTour.length) return;

  const idx = state.activeTour.findIndex(p => p.id === plaqueId);
  if (idx === -1) return;

  const isCurrentAudio = state.currentSpeechPlaqueId === plaqueId;
  if (isCurrentAudio) {
    app.stopSpeech();
  }

  const nextIndex = idx + 1;
  let openMaps = reopenMaps;

  if (nextIndex >= state.activeTour.length) {
    // No more stops; we've finished the tour
    state.currentStopIndex = state.activeTour.length;

    app.stopAudioWatch();
    app.stopSpeech();

    state.toast = 'You’ve reached the final stop on this Curated Tour.';
    state.view = 'OUTRO';
    state.justNavigated = true;
    app.render();
    return;                 // <- important: don't try to reopen Maps
  } else {
    const current = state.currentStopIndex || 0;
    if (nextIndex > current) {
      state.currentStopIndex = nextIndex;
    }
    if (toastMessage) {
      app.showToast(toastMessage);
    }
  }

  if (openMaps) {
    const targetStop = state.activeTour[state.currentStopIndex || 0];
    const navUrl = Geo.generateMapsStopUrl(targetStop);
    if (navUrl) window.open(navUrl, '_blank');
  }

  state.justNavigated = true;
  app.render();
},

      // Logic: Load Collections (and feed autocomplete)
      loadCategories: async () => {

        try {
          state.catalogError = null;
          const plaques = await Api.fetchPlaques(cityCfg.url);
          state.allPlaques = plaques;

          );

          // Default city if none chosen yet
          if (!state.selectedCity && state.availableCities.length) {
            state.selectedCity = state.availableCities[0];

          // 2) Build collections list for the selected city
          const collectionsSet = new Set(
            plaques
              .filter(p => !state.selectedCity || p.area === state.selectedCity)
              .map(p => p.category)
              .filter(c => c && c.trim())
          );
          state.availableCollections = Array.from(collectionsSet).sort();

          // Default collection if none chosen yet
          if (!state.collection && state.availableCollections.length) {
            state.collection = state.availableCollections[0];
          }

          if (state.view === 'HOME') app.render();
        } catch (e) {
          console.error(e);

stopTourAndSaveProgress: () => {
  if (!state.activeTour || !state.activeTour.length) return;

  const existing = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

  // Make sure we have a tour id (should already be set for paid tours)
  let id = state.activeTourMeta && state.activeTourMeta.id;
  const isPaid = !!(state.activeTourMeta && state.activeTourMeta.isPaid);

  const cityName =
    state.selectedCity || (CITIES[state.cityIndex]?.name || 'Tour');

  if (!id) {
    // Fallback: create a new saved tour if somehow not already saved
    id = Date.now().toString();
    existing.unshift({
      id,
      name: `${cityName} walk`,
      date: new Date().toISOString(),
      cityName,
      plaques: state.activeTour,
      isPlanned: state.isPlanned,
      startHint: state.startHint,
      distanceMiles: state.tourDistanceMiles,
      walkMinutes: state.tourWalkMinutes,
      totalMinutes: state.tourTotalMinutes,
      price: state.tourPrice,
      isPaid,
      lastVisitedIndex: state.currentStopIndex || 0,
    });
  } else {
    const idx = existing.findIndex(t => t.id === id);
    if (idx !== -1) {
      existing[idx] = {
        ...existing[idx],
        plaques: state.activeTour,
        isPlanned: state.isPlanned,
        startHint: state.startHint,
        distanceMiles: state.tourDistanceMiles,
        walkMinutes: state.tourWalkMinutes,
        totalMinutes: state.tourTotalMinutes,
        price: state.tourPrice,
        isPaid,
        lastVisitedIndex: state.currentStopIndex || 0,
        date: new Date().toISOString(),
      };
    }
  }

  localStorage.setItem(STORAGE_KEY, JSON.stringify(existing));
  app.showToast('Progress saved – you can resume this tour later.');
  state.view = 'FAVORITES';
  app.render();
},

      generateTour: async (e) => {
  if (e) e.preventDefault();
  state.loading = true;
  state.error = null;
  app.render();

  const cityCfg = CITIES[state.cityIndex];

  try {
    // 1. Base plaque set: city + collection
    const all = state.allPlaques && state.allPlaques.length
      ? state.allPlaques
      : await Api.fetchPlaques(cityCfg.url);

    let filtered = all;

    // City filter
    if (state.selectedCity) {
      const cityName = state.selectedCity.toLowerCase();
      filtered = filtered.filter(p =>
        p.area && p.area.toLowerCase() === cityName
      );
    }

    // Collection filter
    if (state.collection) {
      const col = state.collection.toLowerCase();
      filtered = filtered.filter(p =>
        p.category && p.category.toLowerCase() === col
      );
    }

    if (!filtered.length) {
      throw new Error('No places of interest found for this city / collection.');
    }

    // ALWAYS: plan mode – find best cluster in the city
    const { center, members } = Geo.findBestCluster(filtered, state.radius);

    if (!center || !members.length) {
      throw new Error(
        `No suitable cluster found within ${state.radius} miles for this collection.`
      );
    }

    const startLoc = center;
    state.userLocation = startLoc;
    let nearby = members;
    state.isPlanned = true;

    if (!nearby.length) {
      throw new Error(`No places of interest found within ${state.radius} miles.`);
    }

    // 2. Select & optimise tour
    const shuffled = [...nearby].sort(() => 0.5 - Math.random());
    let selected = shuffled.slice(0, state.stops);
    selected = Geo.optimizeRoute(startLoc, selected);

    // 3. Update state for this tour
    state.candidatePlaques = nearby;
    state.activeTour = selected;
    state.selectedForRemoval = new Set();
    state.playedPlaques = new Set();
    state.activeTourMeta = {
      id: null,
      isPaid: false,
    };

    // planning-stage replace flags + navigation state
    state.planningMarkedForReplace = new Set();
    state.currentStopIndex = 0;
    state.unlockedStops = new Set();
    state.nearlyThereStopId = null;
    state.bannerDismissedStops = new Set();
    state.visibleStoryIds = new Set();

    // 4. Compute a friendly startHint
    try {
      const suggestedAddress = await Api.reverseGeocode(startLoc);
      state.startHint = suggestedAddress;
    } catch (err) {
      console.warn('Reverse geocoding failed, falling back', err);
      state.startHint = cityCfg.exampleAddress || state.selectedCity || '';
    }

    // 5. Compute tour stats & price for the preview
    const stats = Geo.computeTourStats(startLoc, selected);
    state.tourDistanceMiles = stats.distanceMiles;
    state.tourWalkMinutes = stats.walkingMinutes;

    const dwellMinutes = state.activeTour.length * 5;
    state.tourTotalMinutes = Math.round(stats.walkingMinutes + dwellMinutes);

    const rawPrice = PRICE_BASE + PRICE_PER_STOP * state.activeTour.length;
    state.tourPrice = Math.round(rawPrice * 100) / 100;

    // 6. Show preview/paywall
    state.view = 'PREVIEW';
    state.justNavigated = true;
  } catch (err) {
    state.error = err.message || 'Error generating tour';
  } finally {
    state.loading = false;
    app.render();

},
      // Logic: Regenerate (Swap)
      toggleRemove: (id, checked) => {
        // Once a tour is paid, do not allow editing
        if (state.activeTourMeta && state.activeTourMeta.isPaid) return;

        if (checked) state.selectedForRemoval.add(id);
        else state.selectedForRemoval.delete(id);

        // Update checkbox visually without full re-render for speed
        const el = document.getElementById(`lbl-${id}`);
        if (el) {
          el.className = `text-xs font-bold uppercase ${checked ? 'text-red-600' : 'text-gray-400 group-hover:text-gray-600'
            }`;
        }
        const txt = document.getElementById(`txt-${id}`);
        if (txt) txt.innerText = checked ? 'Remove' : 'Keep';
        const card = document.getElementById(`card-${id}`);
        if (card) {
          card.className =
            `bg-white rounded-xl shadow-md overflow-hidden border-l-4 mb-4 ` +
            `relative group transition-all ${checked ? 'border-red-500 bg-red-50' : 'border-plaque-blue'
            }`;
        }

        app.updateActionBar();
      },
      regenerateSelected: () => {
        // No regenerating on paid tours
        if (state.activeTourMeta && state.activeTourMeta.isPaid) return;

        const idsToRemove = Array.from(state.selectedForRemoval).map(String);
        if (!idsToRemove.length) return;

        const removedSet = new Set(idsToRemove);
        const kept = state.activeTour.filter(p => !removedSet.has(String(p.id)));

        const keptIds = new Set(kept.map(p => String(p.id)));
        const pool = state.candidatePlaques.filter(
          p => !keptIds.has(String(p.id)) && !removedSet.has(String(p.id))
        );

        const needed = state.stops - kept.length;

        if (needed > 0 && pool.length < needed) {
          alert(
            'Not enough alternative locations nearby to replace all selected places of interest. ' +
            'Try reducing the number selected or increasing your radius.'
          );
          return;
        }

        const replacements = pool.sort(() => 0.5 - Math.random()).slice(0, needed);
        let newTour = [...kept, ...replacements];

        if (state.userLocation) {
          newTour = Geo.optimizeRoute(state.userLocation, newTour);
        }

        state.activeTour = newTour;
        state.selectedForRemoval = new Set();
        app.render();
      },
      removeSelectedNoReplacement: () => {
        // No removing stops on paid tours
        if (state.activeTourMeta && state.activeTourMeta.isPaid) return;

        const idsToRemove = Array.from(state.selectedForRemoval).map(String);
        if (!idsToRemove.length) return;

        const removedSet = new Set(idsToRemove);
        let newTour = state.activeTour.filter(p => !removedSet.has(String(p.id)));

        state.stops = newTour.length;

        if (state.userLocation && newTour.length > 1) {
          newTour = Geo.optimizeRoute(state.userLocation, newTour);
        }

        state.activeTour = newTour;
        state.selectedForRemoval = new Set();
        app.render();
      },

      // Logic: Favorites
      saveTour: () => {
        if (!state.activeTour.length) return;

        const cityName =
          state.selectedCity || (CITIES[state.cityIndex]?.name || 'Tour');

        const existing = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

        let id = state.activeTourMeta && state.activeTourMeta.id;
        const isPaid = !!(state.activeTourMeta && state.activeTourMeta.isPaid);

        // If this tour hasn’t been saved before, create a new id
        if (!id) {
          id = Date.now().toString();
        }

        const defaultName = state.isPlanned
          ? `${cityName} – ${state.startHint || 'planned walk'}`
          : `${cityName} walk`;

        const name = (prompt('Give this tour a name:', defaultName) || defaultName).trim();

        const tourData = {
          id,
          name,
          date: new Date().toISOString(),
          cityName,
          plaques: state.activeTour,
          isPlanned: state.isPlanned,
          startHint: state.startHint,
          distanceMiles: state.tourDistanceMiles,
          walkMinutes: state.tourWalkMinutes,
          totalMinutes: state.tourTotalMinutes,
          price: state.tourPrice,
          isPaid,
        };

        const idx = existing.findIndex((t) => t.id === id);
        if (idx === -1) {
          existing.unshift(tourData);
        } else {
          existing[idx] = tourData;
        }

        state.activeTourMeta = { id, isPaid };

        localStorage.setItem(STORAGE_KEY, JSON.stringify(existing));
        alert('Tour saved!');
      },

      loadTour: (id) => {
  const existing = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  const tour = existing.find((t) => t.id === id);
  if (!tour) return;

  state.activeTour = (tour.plaques || []).map((p, idx) => ({
    ...p,
    stopNumber: p.stopNumber || idx + 1,
  }));
        state.candidatePlaques = []; // can’t regenerate well from saved
        state.stops = tour.plaques ? tour.plaques.length : 0;

        state.isPlanned = !!tour.isPlanned;
        state.startHint = tour.startHint || '';
        state.selectedCity = tour.cityName || state.selectedCity;

        state.tourDistanceMiles = tour.distanceMiles || 0;
        state.tourWalkMinutes = tour.walkMinutes || 0;
        state.tourTotalMinutes = tour.totalMinutes || 0;
        state.tourPrice = tour.price || 0;

        state.activeTourMeta = {
          id: tour.id,
          isPaid: !!tour.isPaid,
        };

        state.currentStopIndex = 0;

        // NEW: reset on-foot navigation state for this loaded tour
        state.unlockedStops = new Set();
        state.currentStopIndex = 0;
        state.nearlyThereStopId = null;
        state.bannerDismissedStops = new Set();
        state.visibleStoryIds = new Set();

        // IMPORTANT: Only jump straight into the full tour if it’s paid
        state.view = tour.isPaid ? 'TOUR' : 'PREVIEW';
        state.justNavigated = true;

        app.render();
      },

  loadSharedTour: async (payload) => {
  try {
    if (!payload) {
      alert('This shared tour link appears to be invalid or empty.');
      return;
    }

    // Support both:
    // - v2 links: payload.stopIds (short)
    // - old v1 links: payload.plaques (long, but still readable)
    let plaques = [];

    if (Array.isArray(payload.stopIds) && payload.stopIds.length) {
      const ids = payload.stopIds.map(String);

      // Make sure we have the master list loaded
      if (!state.allPlaques || !state.allPlaques.length) {
        const cityCfg = CITIES[state.cityIndex];
        state.allPlaques = await Api.fetchPlaques(cityCfg.url);
      }

      const idSet = new Set(ids);
      plaques = state.allPlaques.filter(p => idSet.has(String(p.id)));

      // Preserve the original order from stopIds
      plaques.sort(
        (a, b) =>
          ids.indexOf(String(a.id)) - ids.indexOf(String(b.id))
      );
    } else if (Array.isArray(payload.plaques) && payload.plaques.length) {
      // Backwards compatibility with old (long) links
      plaques = payload.plaques;
    } else {
      alert('This shared tour link appears to be invalid or empty.');
      return;
    }

    if (!plaques.length) {
      alert('I couldn’t find any stops for this shared tour.');
      return;
    }

    // Ensure stable numbering
    plaques = plaques.map((p, idx) => ({
      ...p,
      stopNumber: p.stopNumber || idx + 1,
    }));

    state.activeTour = plaques;
    state.candidatePlaques = [];
    state.stops = plaques.length;

    state.selectedCity = payload.cityName || state.selectedCity;
    state.isPlanned = !!payload.isPlanned;
    state.startHint = payload.startHint || '';

    state.tourDistanceMiles = payload.distanceMiles || 0;
    state.tourWalkMinutes = payload.walkMinutes || 0;
    state.tourTotalMinutes = payload.totalMinutes || 0;
    state.tourPrice = payload.price || 0;

    // User 2 has NOT paid yet
    state.activeTourMeta = {
      id: null,
      isPaid: false,
    };

    state.currentStopIndex = 0;
    state.unlockedStops = new Set();
    state.nearlyThereStopId = null;
    state.bannerDismissedStops = new Set();
    state.visibleStoryIds = new Set();

    // Take them to the preview/payment screen
    state.view = 'PREVIEW';
    state.justNavigated = true;
    app.render();
  } catch (e) {
    console.error('Error loading shared tour', e);
    alert('Sorry, something went wrong opening this shared tour.');
  }
},
      
      deleteTour: (id, e) => {
        e.stopPropagation();
        const existing = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        const updated = existing.filter(t => t.id !== id);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(updated));

      },

      shareTour: (id, e) => {
        if (e) e.stopPropagation();

        const existing = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        const tour = existing.find(t => t.id === id);
        if (!tour) {
          alert('Sorry, I couldn’t find that tour to share.');
          return;
        }

        if (!tour.isPaid) {
          alert('You can only share a tour after it has been unlocked.');
          return;
        }

        // Important: users who receive the link have NOT paid yet
        const sharePayload = {
          ...tour,
          isPaid: false,
        };

        const baseUrl = window.location.origin + window.location.pathname;
        const encoded = TourSharing.encodeTourForUrl(sharePayload);
        const shareUrl = `${baseUrl}?tour=${encoded}`;

        if (navigator.share) {
          navigator.share({
            title: tour.name || 'Curated Tour',
            text: 'Here’s a Curated Tours route I made – open this link to view and demo unlock it.',
            url: shareUrl,
          }).catch(err => {
            console.log('Share cancelled or failed', err);
          });
          return;
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(shareUrl)
            .then(() => {
              app.showToast('Share link copied to clipboard.');
            })
            .catch(() => {
              alert('Here is your share link:\n\n' + shareUrl);
            });
        } else {
          alert('Here is your share link:\n\n' + shareUrl);
        }
      },

      shareActiveTourFromInfo: () => {
        const meta = state.activeTourMeta || {};
        if (!meta.id || !meta.isPaid) {
          alert('You can only share a tour after it has been unlocked and saved.');
          return;
        }
        app.shareTour(meta.id);
      },
