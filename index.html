renderTour: () => {
  const cityName =
    state.selectedCity || (CITIES[state.cityIndex]?.name || 'Tour');

  // Prefer the collection (e.g. "Britpop") for the tour title.
  // If for some reason state.collection is empty (e.g. loaded from Saved),
  // fall back to the category on the first stop, then to the city name.
  const collectionName =
    state.collection ||
    (state.activeTour[0]?.category || '');

  const tourTitle = collectionName
    ? `${collectionName} Tour`
    : `${cityName} Tour`;
  const safeCityName = escapeHtml(cityName);
  const safeTourTitle = escapeHtml(tourTitle);

  const isPaidTour = !!(state.activeTourMeta && state.activeTourMeta.isPaid);

  const startNote =
    !isPaidTour && state.isPlanned
      ? `
      <div class="mb-4 bg-blue-50 border-l-4 border-plaque-blue p-3 rounded-r-lg text-xs text-gray-800">
        <p class="font-semibold mb-1">Suggested starting area</p>
        <p>
          This tour has been centred on a cluster of places for this collection.
          Begin your walk near
          <span class="font-semibold">${escapeHtml(state.startHint || 'the suggested starting point')}</span>,
          then follow the stops in order.
        </p>
      </div>
    `
      : '';

  const nearStopBanner = app.renderNearStopBanner();

  const total = state.activeTour.length;
  let currentCardHtml = '';
  let safeIndex = 0;
  let currentPlaque = null;

  if (!total) {
    currentCardHtml = `
      <p class="text-sm text-gray-500">
        There are no stops on this Curated Tour.
      </p>
    `;
  } else {
    const idx = app.getCurrentStopIndex();
    safeIndex = Math.min(Math.max(idx, 0), total - 1);
    currentPlaque = state.activeTour[safeIndex];
    currentCardHtml = app.renderCard(currentPlaque, safeIndex, total);
  }

  const liveProgressHtml = currentPlaque
    ? `
      <div class="mb-4 bg-white border border-blue-100 rounded-xl p-4 shadow-sm">
        <p class="text-xs font-semibold text-plaque-blue uppercase tracking-wide">
          Current stop
        </p>
        <div class="mt-1 flex items-start justify-between gap-3">
          <div>
            <p class="text-base font-bold text-gray-900">
              Stop ${safeIndex + 1} of ${total}: ${escapeHtml(currentPlaque.title)}
            </p>
            <p class="text-xs text-gray-500 mt-1">
              Stay in Curated Tours: follow the route guide, play the story, then continue when you are ready.
            </p>
          </div>
          <span class="text-xs font-bold text-gray-600 bg-gray-100 px-2 py-1 rounded-full whitespace-nowrap">
            ${safeIndex + 1}/${total}
          </span>
        </div>
      </div>
    `
    : '';

  return `
    <div class="pb-32">
      <div class="flex items-center justify-center mb-4">
        <div class="text-center">
          <h2 class="text-lg font-bold text-gray-900">${safeTourTitle}</h2>
          <p class="text-xs text-gray-500">
            ${safeCityName ? safeCityName + ' · ' : ''}${state.activeTour.length} Locations
          </p>
        </div>
      </div>

      ${startNote}
      ${liveProgressHtml}
      <div class="mb-4 space-y-2">
        <div id="tour-map" class="ct-map"></div>
        <p class="text-xs text-gray-500">
          Blue pins are upcoming stops, green pins are completed stops, and the amber pin is your current stop. The dashed green line connects your latest location to the current stop when location is available.
        </p>
      </div>
      ${nearStopBanner}

      <div class="space-y-4">
        ${currentCardHtml}
      </div>

      <div
        id="action-bar"
        class="fixed bottom-16 left-0 right-0 bg-white border-t border-gray-200 p-4
               shadow-[0_-5px_10px_rgba(0,0,0,0.05)] z-10 flex flex-col gap-3"
      >
        <!-- Filled by updateActionBar after render() -->
      </div>
    </div>
  `;
},

renderCard: (plaque, index, total) => {
  const isSel = state.selectedForRemoval.has(plaque.id);
  const isPaidTour = !!(state.activeTourMeta && state.activeTourMeta.isPaid);
  const canEditTour = !isPaidTour;

  // NEW: stable numbering
  const n = plaque.stopNumber || index + 1;
  const isFirst = n === 1;
  const isLast  = n === total;

  let label = `Stop ${n}`;
  let badgeText = n;
  let badgeBg = 'bg-plaque-blue';

  if (isFirst) {
    badgeBg = 'bg-green-600';
    // Optional: if you still want a subtle hint:
    // label = `Stop ${n} · Starting point`;
  } else if (isLast) {
    badgeBg = 'bg-gray-800';
    // Optional: label = `Stop ${n} · Final stop`;
  }

  const isCurrentAudio = state.currentSpeechPlaqueId === plaque.id;
  const isPaused = state.isSpeechPaused && isCurrentAudio;
  const isPlaying = state.isSpeechPlaying && isCurrentAudio;
  const cardBorderClass =
    isSel && canEditTour ? 'border-red-500 bg-red-50' : 'border-plaque-blue';

  const canGoBack = (state.currentStopIndex || 0) > 0;
  const isUnlocked = !!(state.unlockedStops && state.unlockedStops.has(plaque.id));
  const hasStoryText = !!(plaque.bio || plaque.summary);
  const isStoryVisible = !!(state.visibleStoryIds && state.visibleStoryIds.has(plaque.id));
  const storyText = plaque.bio || plaque.summary || '';
  const hasRecordedAudio = !!plaque.audioFile;
  const currentStopMapsUrl = Geo.generateMapsStopUrl(plaque);
  const savedAudioProgress = app.getAudioProgress(plaque.id);
  const showSavedProgress =
    hasRecordedAudio &&
    !isCurrentAudio &&
    savedAudioProgress.time > 2 &&
    (!savedAudioProgress.duration || savedAudioProgress.time < savedAudioProgress.duration - 2);
  const audioTime = isCurrentAudio ? state.currentAudioTime : savedAudioProgress.time;
  const audioDuration = isCurrentAudio ? state.currentAudioDuration : savedAudioProgress.duration;
  const audioMax = Math.max(1, Math.floor(audioDuration || audioTime || 1));
  const audioValue = Math.min(audioMax, Math.floor(audioTime || 0));
  const audioDurationLabel = audioDuration ? app.formatAudioTime(audioDuration) : '--:--';
  const listenLabel = isCurrentAudio && isPlaying
    ? 'Restart audio'
    : showSavedProgress
      ? 'Resume recorded audio'
      : hasRecordedAudio
        ? 'Play recorded audio'
        : 'Listen';
  const audioInProgress = isCurrentAudio && (isPlaying || isPaused);
  const continueLabel = audioInProgress
    ? (isLast ? 'Finish before audio ends' : 'Continue before audio ends')
    : (isLast ? 'Finish tour' : 'Continue to next stop');
  const continueClass = audioInProgress
    ? 'bg-yellow-50 hover:bg-yellow-100 text-yellow-900 border border-yellow-300'
    : 'bg-plaque-blue hover:bg-blue-900 text-white';

  return `
    <div id="card-${escapeHtml(plaque.id)}"
         class="bg-white rounded-xl shadow-md overflow-hidden border-l-4 mb-4
                relative group transition-all ${cardBorderClass}">
      <div class="p-5">
        <div class="flex justify-between items-start mb-2">
          <div class="flex gap-2 items-center">
            <div class="${badgeBg} text-white w-8 h-8 flex items-center justify-center rounded-full font-bold shadow-sm flex-shrink-0">
              ${badgeText}
            </div>
            <div class="flex flex-col">
              <span class="text-xs text-gray-400 font-mono uppercase tracking-wide">
                ${label}
              </span>
              ${
                plaque.category
                  ? `<span class="text-xs text-gray-500 font-bold bg-gray-100 px-2 py-0.5 rounded-full inline-block w-max">
                       ${escapeHtml(plaque.category)}
                     </span>`
                  : ''
              }
              ${hasRecordedAudio
                ? `<span class="text-xs text-green-700 font-bold bg-green-50 px-2 py-0.5 rounded-full inline-block w-max mt-1">
                     Recorded audio
                   </span>`
                : ''}
            </div>
          </div>

          ${/* Keep your existing Keep/Remove toggle when editable */''}
          ${canEditTour ? `
            <label class="flex items-center gap-2 cursor-pointer select-none">
              <span id="txt-${escapeHtml(plaque.id)}"
                    class="text-xs font-bold uppercase ${isSel ? 'text-red-600' : 'text-gray-400 group-hover:text-gray-600'}">
                ${isSel ? 'Remove' : 'Keep'}
              </span>
              <input
                type="checkbox"
                ${isSel ? 'checked' : ''}
                onchange="app.toggleRemove(${jsString(plaque.id)}, this.checked)"
                class="w-5 h-5 text-red-600 border-gray-300 rounded focus:ring-red-500"
              >
            </label>
          ` : ''}
        </div>

        <h3 class="text-lg font-bold text-gray-900 leading-tight mb-2 mt-2 pr-2">
          ${escapeHtml(plaque.title)}
        </h3>

        <div class="flex items-start text-gray-500 text-sm mb-3">
          <span class="mr-1 mt-0.5">${Icons.MapPin}</span>
          <span class="font-medium">${escapeHtml(plaque.address)}</span>
        </div>

        ${currentStopMapsUrl
          ? `
        <a
          href="${escapeHtml(currentStopMapsUrl)}"
          target="_blank"
          class="w-full mb-3 flex items-center justify-center gap-2 py-2 px-3
                 bg-white hover:bg-gray-50 text-gray-700 rounded-lg
                 text-xs font-semibold transition-colors border border-gray-200"
        >
          ${Icons.MapPin}
          <span>Fallback: open this stop in Google Maps</span>
        </a>
        `
          : ''}

        <p class="text-gray-600 text-sm leading-relaxed mb-4">
          ${escapeHtml(plaque.summary)}
        </p>

        <div class="border-t border-gray-100 pt-3 space-y-3">

          <!-- Listen: primary green full-width button -->
          <button
            onclick="app.speak(${jsString(plaque.id)})"
            class="w-full flex items-center justify-center gap-2 py-2.5 px-3
                   bg-green-600 hover:bg-green-700 text-white rounded-lg
                   text-sm font-semibold transition-colors"
          >
            ${Icons.Speaker}
            <span>${listenLabel}</span>
          </button>

          ${hasRecordedAudio && (isCurrentAudio || showSavedProgress)
            ? `
          <div class="bg-gray-50 border border-gray-200 rounded-lg p-3 space-y-2">
            <div class="flex items-center justify-between gap-3">
              <p class="text-xs font-semibold text-gray-700">
                ${isCurrentAudio ? (isPaused ? 'Audio paused' : 'Audio playing') : 'Saved audio position'}
              </p>
              <p id="audio-time-${escapeHtml(plaque.id)}" class="text-xs tabular-nums text-gray-500">
                ${app.formatAudioTime(audioTime)} / ${audioDurationLabel}
              </p>
            </div>
            <input
              id="audio-range-${escapeHtml(plaque.id)}"
              type="range"
              min="0"
              max="${audioMax}"
              value="${audioValue}"
              ${isCurrentAudio ? `oninput="app.seekAudio(this.value)"` : 'disabled'}
              class="w-full accent-green-600"
            >
            <button
              type="button"
              onclick="app.restartAudio(${jsString(plaque.id)})"
              class="text-xs font-semibold text-plaque-blue hover:underline"
            >
              Restart from beginning
            </button>
          </div>
          `
            : ''}

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            ${!isUnlocked
              ? `
            <button
              type="button"
              onclick="app.manualUnlockStop(${jsString(plaque.id)})"
              class="w-full py-2 px-3 rounded-lg border border-yellow-300 bg-yellow-50
                     text-yellow-900 text-xs font-semibold hover:bg-yellow-100"
            >
              UAT: unlock audio here
            </button>
            `
              : ''}
            ${hasStoryText
              ? `
            <button
              type="button"
              onclick="app.toggleStoryText(${jsString(plaque.id)})"
              class="w-full py-2 px-3 rounded-lg border border-gray-300 bg-white
                     text-gray-800 text-xs font-semibold hover:bg-gray-50"
            >
              ${isStoryVisible ? 'Hide story text' : 'Read story text'}
            </button>
            `
              : ''}
          </div>

          ${isStoryVisible
            ? `
          <div class="bg-gray-50 border border-gray-200 rounded-lg p-3 max-h-72 overflow-y-auto">
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">
              Story text
            </p>
            <p class="text-sm text-gray-700 leading-relaxed whitespace-pre-line">${escapeHtml(storyText)}</p>
          </div>
          `
            : ''}

          <!-- Pause/Resume + Stop audio (only when this card is active) -->
          ${
            isCurrentAudio
              ? `
          <div class="flex flex-wrap gap-2">
            <button
              onclick="app.${isPaused ? 'resumeSpeech' : 'pauseSpeech'}()"
              class="flex items-center justify-center gap-1 py-2 px-3 rounded-lg
                     text-xs font-semibold border border-gray-300 bg-white
                     hover:bg-gray-50"
            >
              ${isPaused ? Icons.Play : Icons.Pause}
              <span>${isPaused ? 'Resume' : 'Pause'}</span>
            </button>
            <button
              onclick="app.stopSpeech()"
              class="flex items-center justify-center gap-1 py-2 px-3 rounded-lg
                     text-xs font-semibold border border-red-400 text-red-600
                     bg-white hover:bg-red-50"
            >
              ${Icons.Stop}
              <span>Stop audio</span>
            </button>
          </div>
          `
              : ''
          }

          <!-- Continue: primary blue full-width button -->
          <button
            type="button"
            onclick="app.continueToNext(${jsString(plaque.id)})"
            class="w-full py-2.5 rounded-lg ${continueClass}
                   text-sm font-semibold"
          >
            ${continueLabel}
          </button>

          <!-- Back / Skip row + centred Stop button -->
          <div class="flex flex-col items-center gap-2 mt-1">

            <!-- Back + Skip, equal width and centred -->
            <div class="flex gap-2 w-full max-w-xs justify-center">
              ${
                canGoBack
                  ? `
              <button
                type="button"
                onclick="app.goBackOneStop()"
                class="flex-1 px-3 py-2 rounded-lg border border-plaque-blue
                       bg-white text-xs font-semibold text-plaque-blue
                       hover:bg-blue-50"
              >
                Back to previous
              </button>
              `
                  : ''
              }

              <button
                type="button"
                onclick="app.skipStop(${jsString(plaque.id)})"
                class="${
                  canGoBack ? 'flex-1' : 'w-full'
                } px-3 py-2 rounded-lg bg-gray-900 text-white text-xs font-semibold
                       hover:bg-black"
              >
                Skip this stop
              </button>
            </div>

            <!-- Stop tour & save progress: same width as row above, centred -->
            <button
              type="button"
              onclick="app.stopTourAndSaveProgress()"
              class="w-full max-w-xs px-4 py-2.5 rounded-lg bg-red-600
                     hover:bg-red-700 text-white text-xs font-semibold
                     shadow-sm"
            >
              Stop tour &amp; save progress
            </button>
          </div>
        </div>
      </div>
    </div>
  `;
},
      renderFavorites: () => {
        const tours = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

        return `
    <div class="h-full">
      <div class="flex items-center mb-6">
        <button onclick="app.goHome()" class="p-2 -ml-2 text-gray-600 hover:text-plaque-blue">
          ${Icons.ArrowLeft}
        </button>
        <h2 class="text-2xl font-bold text-gray-900 ml-2">My Saved Tours</h2>
      </div>

      ${tours.length === 0
            ? `
          <div class="text-center py-20 bg-white rounded-2xl border border-dashed border-gray-300">
            <p class="text-gray-500 mb-4">No saved tours yet.</p>
            <button onclick="app.goHome()" class="text-plaque-blue font-medium hover:underline">
              Create your first tour
            </button>
          </div>
        `
            : `
          <div class="space-y-4">
            ${tours
              .map((tour) => {
                const isPaid = !!tour.isPaid; // old tours default to locked
                const padlockIcon = isPaid ? Icons.PadlockUnlocked : Icons.PadlockLocked;
                const padlockText = isPaid ? 'Unlocked tour' : 'Locked – demo unlock required';
                const padlockColor = isPaid ? 'text-plaque-blue' : 'text-red-500';

                return `
                    <div onclick="app.loadTour(${jsString(tour.id)})"
                         class="bg-white p-5 rounded-xl shadow-sm border border-gray-200
                                hover:border-plaque-blue hover:shadow-md transition-all cursor-pointer
                                group relative">
                      <div class="flex justify-between items-start">
                        <div>
                          <h3 class="font-bold text-lg text-gray-800 group-hover:text-plaque-blue">
                            ${escapeHtml(tour.name || `${tour.cityName} walk`)}
                          </h3>
                          <p class="text-xs text-gray-500 mt-1">
                            ${tour.isPlanned
                    ? `Planned tour – start near: ${tour.startHint || 'chosen address'}`
                    : 'Recorded from your current location'
                  }
                          </p>
                          <p class="text-xs text-gray-400 mt-1">
                            Saved on ${new Date(tour.date).toLocaleDateString()}
                          </p>
                          <div class="mt-3 flex gap-1">
                            ${tour.plaques
                    .slice(0, 3)
                    .map(
                      () =>
                        `<div class="w-2 h-2 rounded-full bg-gray-300 group-hover:bg-plaque-blue"></div>`
                    )
                    .join('')}
                            ${tour.plaques.length > 3
                    ? `<span class="text-xs text-gray-400 ml-1">+${tour.plaques.length - 3}</span>`
                    : ''
                  }
                          </div>
                        </div>

                       <div class="flex flex-col items-end gap-2">
                          <!-- Padlock status -->
                          <div class="flex items-center gap-1 text-xs ${padlockColor}">
                            ${padlockIcon}
                            <span>${padlockText}</span>
                          </div>

                          ${
                            isPaid
                              ? `
                              <!-- Share button (only for paid tours) -->
                              <button
                                onclick="app.shareTour(${jsString(tour.id)}, event)"
                                class="px-3 py-1.5 text-xs rounded-full border border-gray-300
                                       text-gray-700 hover:bg-gray-50 flex items-center gap-1
                                       transition-colors z-10"
                              >
                                ${Icons.Share}
                                <span>Share</span>
                              </button>
                              `
                              : ''
                          }

                          <!-- Delete button -->
                          <button
                            onclick="app.deleteTour(${jsString(tour.id)}, event)"
                            class="p-2 text-gray-300 hover:text-red-500 hover:bg-red-50
                                   rounded-full transition-colors z-10"
                          >
                            ${Icons.Trash}
                          </button>
                        </div>
                      </div>
                    </div>
                  `;
              })
              .join('')
            }
          </div>
        `
          }
    </div>
  `;
      },

        confirmArrivedAtStop: (plaqueId) => {
        if (!state.unlockedStops) state.unlockedStops = new Set();
        if (!state.bannerDismissedStops) state.bannerDismissedStops = new Set();

        // Keep this stop unlocked and clear the banner
        state.unlockedStops.add(plaqueId);
        state.nearlyThereStopId = null;

        // Important: never show the yellow banner again for this stop
        state.bannerDismissedStops.add(plaqueId);

        app.render();

        // After re-render, scroll that card into view
        setTimeout(() => {
          const el = document.getElementById(`card-${plaqueId}`);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        }, 50);
      },

      renderGuide: () => {
  return `
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-md p-6 space-y-4 mt-4">
      <h2 class="text-xl font-bold text-gray-900">How Curated Tours works</h2>
      <p class="text-sm text-gray-700">

      <h3 class="text-sm font-semibold text-gray-900 mt-3">2. Choose a collection</h3>
      <p class="text-sm text-gray-700">

      <p class="text-sm text-gray-700">

      </p>
      <p class="text-sm text-gray-700">
        I’ll scan all the locations in that city and collection, then choose a

      <h3 class="text-sm font-semibold text-gray-900 mt-3">4. Preview your Curated Tour</h3>
      <p class="text-sm text-gray-700">
        Tap <strong>Begin planning your Curated Tour</strong> to see a
        preview. You’ll get:
      </p>
      <ul class="list-disc list-inside text-sm text-gray-700 space-y-1">
        <li>A list of the stops I’ve chosen for your collection.</li>
        <li>An <strong>approximate distance</strong> for the full walk.</li>
        <li>An <strong>approximate duration</strong>, including walking time and
            a few minutes at each stop.</li>
        <li>The <strong>future tour price</strong> for this route.</li>
      </ul>
      <p class="text-sm text-gray-700">

      <h3 class="text-sm font-semibold text-gray-900 mt-3">5. Fine-tune before you unlock</h3>
      <p class="text-sm text-gray-700">

      </p>
      <p class="text-sm text-gray-700">
        Once you’re happy, tap <strong>Demo unlock this tour</strong> to move to the
        start screen for your unlocked tour, or choose
        <strong>Save this Curated Tour for later</strong> to store it in the
        <strong>Saved</strong> tab on your device.
      </p>

      <h3 class="text-sm font-semibold text-gray-900 mt-3">6. Start your tour</h3>
      <p class="text-sm text-gray-700">
        After the demo unlock, you’ll see a short “Before you start your Curated Tour”
        info screen. From here you can:
      </p>
      <ul class="list-disc list-inside text-sm text-gray-700 space-y-1">
        <li>Read safety tips and how the live tour flow works.</li>
        <li>Tap <strong>Got it – start in Curated Tours</strong> to open the live in-app route guide.</li>
        <li>Use <strong>Share this Curated Tour</strong> to copy or send a

      <h3 class="text-sm font-semibold text-gray-900 mt-3">7. Walk between stops</h3>
      <p class="text-sm text-gray-700">

      <p class="text-sm text-gray-700">
        When it is safe, use the stop card below the map and tap
        <strong>Listen</strong>. Where recorded MP3 audio is available,

      <h3 class="text-sm font-semibold text-gray-900 mt-3">8. Move between stops</h3>

      <ul class="list-disc list-inside text-sm text-gray-700 space-y-1">

            last location.</li>
        <li>Tap <strong>Skip this stop</strong> to miss one out and re-route

      <h3 class="text-sm font-semibold text-gray-900 mt-3">9. Saved and shared tours</h3>

      <ul class="list-disc list-inside text-sm text-gray-700 space-y-1">

      <p class="text-xs text-gray-500 mt-4">

  `;
},
      renderColours: () => {
        return `
                <div class="max-w-md mx-auto bg-white rounded-2xl shadow-md p-6 space-y-4 mt-4">
                    <h2 class="text-xl font-bold text-gray-900">Understanding plaque colours</h2>
                    <p class="text-sm text-gray-700">
                        Different organisations use different coloured plaques to mark
                        people, events and buildings of interest. Colours vary by city, but
                        this rough guide helps you make sense of what you see.
                    </p>

                    <div class="space-y-3 text-sm text-gray-700">
                        <div>
                            <h3 class="font-semibold text-plaque-blue">Blue plaques</h3>
                            <p>
                                Often used for nationally significant figures or events.
                                In London, the classic blue plaque is usually associated
                                with English Heritage.
                            </p>
                        </div>

                        <div>
                            <h3 class="font-semibold text-green-700">Green and other local colours</h3>
                            <p>
                                Many boroughs and local societies use their own colours

                            <p>
                                Regardless of colour, the lettering on the plaque tells you

                                was chosen – a home, workplace, meeting point or key event.
                            </p>
                        </div>

                        <div>
                            <h3 class="font-semibold text-gray-900">PlaqueLark’s role</h3>
                            <p>
                                PlaqueLark doesn’t change or standardise colours – it simply
                                helps you find interesting plaques nearby and string them
                                together into a walkable story.
                            </p>
                        </div>
                    </div>
                </div>
                `;
      }
    };

    document.addEventListener('visibilitychange', () => {
      if (state.currentAudioElement) {
        app.updateAudioProgressUi();
      }

      if (
        !document.hidden &&
        state.currentAudioElement &&
        state.currentAudioElement.paused &&
        state.isSpeechPlaying
      ) {
        state.isSpeechPlaying = false;
        state.isSpeechPaused = true;
        app.render();
      }
    });

    window.addEventListener('pagehide', () => {
      if (state.currentAudioElement) {
        app.updateAudioProgressUi();
      }
    });

    // Initialize App
    app.init();
  </script>
</body>

</html>
